[project]
name = "dental-demo-rig"
version = "1.0.0"
description = "Cloneable, prospect-branded dental AI receptionist demo. Sales asset, not the product."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Windows ships no system zoneinfo database; the rig resolves IANA names.
    "tzdata>=2024.2",
]

[project.scripts]
clone-demo = "clone.cli:app"
demo-rehearse = "rehearsal.run:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["clone", "webhooks", "rehearsal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
