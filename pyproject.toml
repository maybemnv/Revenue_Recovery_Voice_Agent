[project]
name = "revenue-recovery-voice-agent"
version = "0.1.0"
description = "Telephony-native AI receptionist on Twilio Media Streams + OpenAI Realtime GA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.27.2",
    "twilio>=9.3.7",
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "stripe>=11.2.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi,celery]>=2.19.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1.3",
]

[project.scripts]
kb-ingest = "apps.api.cli.kb_ingest:main"
eval-run = "apps.eval.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["apps/api/db/migrations/versions", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["apps/api/db/migrations/", "apps/web/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
